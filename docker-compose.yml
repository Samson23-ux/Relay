  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: migrate
    env_file: .env
    volumes:
      - .:/Relay
      - /Relay/.venv
    environment:
      - ASYNC_DB_URL=postgresql+asyncpg://postgres:postgres@relay_api_db:5432/relay
    entrypoint: ["alembic", "upgrade", "head"]
    depends_on:
      relay_api_db:
        condition: service_healthy
      relay_broker:
