      dockerfile: Dockerfile
    container_name: user_service_1
    restart: always
    env_file: .env
    volumes:
      - .:/Relay
      - /Relay/.venv
      - pytest_cache:/Relay/.pytest_cache
    environment:
      - REDIS_URL=redis://relay_redis:6379/0
      - BROKER_URL=amqp://guest:guest@relay_broker:5672/vhost
      - ASYNC_DB_URL=postgresql+asyncpg://postgres:postgres@relay_api_db:5432/relay
      - SYNC_DB_URL=postgresql+psycopg2://postgres:postgres@relay_api_db:5432/relay
    entrypoint:
      ["uvicorn", "apps.user_service.app.main:app", "--port", "8001", "--host", "0.0.0.0"]
    depends_on:
      migrate:
        condition: service_completed_successfully

