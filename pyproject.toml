[project]
name = "relay"
version = "0.1.0"
description = "A minimalistic API Gateway"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "fastapi[all]>=0.140.0",
    "psycopg2>=2.9.12",
    "sqlalchemy>=2.0.51",
    "celery>=5.6.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "redis>=8.0.1",
    "resend>=2.34.0",
    "asgi-lifespan>=2.1.0",
    "python-jose>=3.5.0",
    "pwdlib[argon2]>=0.3.0",
    "authlib>=1.7.2",
]
